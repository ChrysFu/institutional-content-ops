name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" actionlint
          ./actionlint -color

  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ruff
        run: python -m pip install ruff==0.15.2

      - name: Lint Python sources
        run: ruff check src tests

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run behavior tests
        run: python -m unittest discover -s tests -v

      - name: Run built-in preflight smoke check
        run: python src/content_guard.py --self-test

      - name: Validate example policy and draft
        run: >-
          python src/content_guard.py
          --draft examples/draft-ready.md
          --policy content-policy.example.json
          --fail-on-issues

      - name: Validate batch scan and SARIF serialization
        run: >-
          python src/content_guard.py
          --scan examples
          --policy content-policy.example.json
          --format sarif
          --content-id ci-example
          --revision ${{ github.sha }}
          --policy-version example-v1
          --output artifacts/content-scan.sarif
          --fail-on-issues

      - name: Validate repository documentation and JSON
        run: python src/repository_checks.py .
