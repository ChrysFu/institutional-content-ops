name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run behavior tests
        run: python -m unittest discover -s tests -v

      - name: Run built-in preflight smoke check
        run: python src/content_guard.py --self-test

      - name: Validate example policy and draft
        run: >-
          python src/content_guard.py
          --draft examples/draft-ready.md
          --policy content-policy.example.json
          --fail-on-issues

      - name: Validate repository documentation and JSON
        run: python src/repository_checks.py .
